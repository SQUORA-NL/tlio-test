# Copy this file to  .github/workflows/tlio-tests.yml  in your own repository.
#
# It runs your TLio script tests on every pull request that touches scripts or
# tests, and on every push to main. A failing test fails the check.
name: TLio script tests

on:
  pull_request:
    paths:
      - "scripts/**"                       # change to the folder that holds your scripts
      - ".github/workflows/tlio-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
  workflow_dispatch:                       # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Run script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: SQUORA-NL/tlio-test@v1.0.0
        with:
          version: 1.0.0                   # the tool version; keep it in step with the tag above
          paths: scripts                   # files or folders, separated by spaces
